[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mandate-lang"
version = "0.1.0"
description = "Mandate -- an agent-native programming language"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["click", "rich", "openai>=1.0"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/mandate"]

[project.scripts]
mandate = "mandate.cli:main"
